# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "puhurid"
version = "1.2.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Puhuri 2 - natiivi XMPP-viestinsovellus Ubuntu Touchille"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
# The XMPP stack. `tokio-xmpp` owns the connection: SASL, STARTTLS, SRV
# resolution, XEP-0198 stream management and the automatic reconnect;
# `xmpp-parsers` gives the stanzas their types. We drive the client and decide
# what each stanza means - the high-level `xmpp` crate was tried first, but it
# panics on a message without a `from` attribute, and that is exactly what a
# XEP-0313 archive result is.
tokio-xmpp = "=6.0.0"
xmpp-parsers = "=0.23.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "fs"] }
futures = "0.3"
# XEP-0363: uploading a picture or a voice message, and downloading what the
# other side sends. The same reqwest the `xmpp` crate already pulls in, with
# the same rustls configuration, so the features unify and there is one TLS
# stack in the binary. `stream` is what lets an upload go out **piece by
# piece** instead of being read whole into memory: the same pieces are what
# the progress bar in the interface counts (2026-10-16).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
# The pieces of a streamed upload body. (Already in the tree through reqwest
# and tokio-xmpp; the version is spelled out because it is now ours.)
bytes = "1"
# The message store is SQLite (bundled, so nothing has to be installed on the
# phone and the cross build stays self-contained).
rusqlite = { version = "0.40", features = ["bundled"] }
# Only for stopping the recorder with SIGTERM, so that it flushes what it has.
libc = "0.2"
# Randomness and base64: the OMEMO layer uses the first for the crypto
# provider, and the push secret (XEP-0357) is base64 of 16 random bytes in
# both builds.
getrandom = "0.3"
base64 = "0.22"
# The connection lock is **re-entrant** on purpose: `libsignal-protocol-c`
# calls our store callbacks inside `decrypt`, while the transaction holds the
# connection - so the same thread has to be able to take it again. See
# `src/db.rs` and docs/DECISIONS.md (L1, 2026-10-11).
parking_lot = "0.12"

# OMEMO only (behind the `omemo` feature): the primitives
# `libsignal-protocol-c` asks its host for - a random source, HMAC-SHA256,
# SHA-512 and AES-256 in the two modes the ratchet selects. The library owns
# the ratchet; these are the primitives it calls back for, so that the project
# writes no cryptography of its own (docs/OMEMO.md, docs/DECISIONS.md).
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
aes = { version = "0.9", optional = true }
cbc = { version = "0.2", features = ["alloc"], optional = true }
ctr = { version = "0.10", optional = true }
# The OMEMO 0.3 payload is AES-128-GCM (XEP-0384 0.3.0 §4.5): a random
# 16-byte key and a 12-byte IV per message, with the 16-byte tag travelling
# next to the key through the ratchet. The cipher comes from the same
# RustCrypto family as the rest.
aes-gcm = { version = "0.11", optional = true }
# minidom (through `xmpp-parsers`) is rxml-backed, and dropping the
# `prekey='false'` attribute xso writes needs rxml's attribute map. It is
# already in the tree through minidom, so this adds no build cost.
rxml = { version = "0.14", optional = true }
[features]
default = []
# OMEMO (XEP-0384) is the Signal ratchet over XMPP. The ratchet is
# libsignal-protocol-c - the very library the deployed OMEMO 0.3 clients use,
# so the wire format matches by construction (docs/DECISIONS.md) - linked as
# static aarch64 libraries built by tools/build-libsignal-c.sh. The OMEMO
# layer above it (device lists, bundles, the envelope, padding, HMAC) is ours.
# On the host the system's libsignal-protocol-c is used instead, so the layer
# can be tested without a phone.
omemo = ["dep:hmac", "dep:sha2", "dep:aes", "dep:cbc", "dep:ctr", "dep:aes-gcm", "dep:rxml"]
# Testikoukku: nimetyt kaatumis- ja vikapisteet OMEMO:n turvatesteille
# (`src/failpoint.rs`, `src/engine/xmpp_crash_tests.rs`). Ilman tätä featurea
# `failpoint!` ja `faultpoint!` kääntyvät olemattomiksi eivätkä niiden nimet
# päädy binääriin - `tools/failpoint-tarkistus.sh` todistaa sen.
failpoints = []

[lib]
name = "puhurid"
path = "src/lib.rs"

[[bin]]
name = "puhurid"
path = "src/bin/puhurid.rs"

[[bin]]
name = "puhuri-ctl"
path = "src/bin/puhuri_ctl.rs"

# Pinned registry source with a reviewed, optional durable ingress barrier.
# Provenance, local patch and full MPL text: vendor/tokio-xmpp-6.0.0/.
[patch.crates-io]
tokio-xmpp = { path = "../vendor/tokio-xmpp-6.0.0" }
xmpp-parsers = { path = "../vendor/xmpp-parsers-0.23.0" }
